# Local stand-ins for every production dependency (build plan, "Prerequisites").
# A demo needs none of the real services, provided each stays behind its port
# (§10) so it can be swapped later without touching a use case.
name: blood-connect

services:
  postgres:
    # 16+ is load-bearing: FOR UPDATE SKIP LOCKED, partial unique indexes and
    # the transactional counter of §7.1 all depend on it (§11.3).
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blood_connect
    ports:
      # 5433, not 5432: a natively installed PostgreSQL commonly holds 5432, and
      # a connection that silently reaches the wrong server is a bad hour.
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Roles and the test database are provisioned here rather than in a
      # migration: roles are cluster-wide, and production provisions them
      # outside the release. Migrations own schemas, tables and grants.
      - ./db/docker/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d blood_connect']
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    # The local mail catcher. Invites, OTPs and update-request outcomes all
    # land in its inbox, so no sending domain or provider account is needed.
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '1025:1025'   # SMTP
      - '8025:8025'   # web inbox
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  minio:
    # S3-compatible object storage for seals (§3) and, later, camera frames (§4).
    # Private bucket; objects are only ever served through an authenticated route.
    # quay.io, not Docker Hub: Docker Hub's minio/minio now denies anonymous
    # pulls ("requested access to the resource is denied"), which is where
    # MinIO itself publishes going forward.
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/blood-connect &&
      mc anonymous set none local/blood-connect
      "

volumes:
  postgres-data:
  minio-data:
